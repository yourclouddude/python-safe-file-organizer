[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yourclouddude-safe-file-organizer"
version = "1.0.0"
description = "Safe Python file organizer with preview, collision handling, manifests, and rollback."
requires-python = ">=3.11"
authors = [{ name = "YourCloudDude" }]

[project.scripts]
file-organizer = "file_organizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
